<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - SVPMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">

  <div class="auth-card">
    <a href="login.html" style="position: absolute; top: 1.25rem; right: 1.25rem; color: var(--text-muted); font-size: 1.25rem; text-decoration: none;" title="Back to Login">✕</a>

    <div class="auth-card-header">
      <div class="brand-icon">🔑</div>
      <h2>Forgot Password?</h2>
      <p>Enter your registered email to receive a 6-digit verification code</p>
    </div>

    <form action="verify-otp.html">
      <div class="form-group">
        <label class="form-label">Registered Email</label>
        <input type="email" class="form-control" required placeholder="user@company.com" value="user@company.com">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Send Verification OTP ➔</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="login.html" style="font-size: 0.875rem;">← Back to Login</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
