<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SVPMS Enterprise Security</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <div class="auth-card">
    <a href="choose-role.html" style="position: absolute; top: 1.25rem; right: 1.25rem; color: var(--text-muted); font-size: 1.25rem; text-decoration: none;" title="Back to Role Selection">✕</a>

    <div class="auth-card-header">
      <div class="brand-icon">🔐</div>
      <h2>Welcome Back</h2>
      <p>Sign in to <span id="login-role-title" style="font-weight: 700; color: var(--accent-primary);">Portal</span></p>
    </div>

    <form id="standalone-login-form" action="select-org.html">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="login-email" class="form-control" required placeholder="admin@enterprise.com" value="admin@enterprise.com">
      </div>

      <div class="form-group">
        <div class="flex justify-between items-center mb-1">
          <label class="form-label">Password</label>
          <a href="forgot-password.html" style="font-size: 0.8rem;">Forgot password?</a>
        </div>
        <div class="form-control-wrapper">
          <input type="password" id="login-password" class="form-control" required placeholder="••••••••" value="Password123!">
          <span id="toggle-password" class="password-toggle-btn">👁️</span>
        </div>
      </div>

      <div class="flex justify-between items-center" style="margin-bottom: 1.25rem;">
        <label style="font-size: 0.85rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
          <input type="checkbox" id="remember-me" checked> Remember me
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg">Sign In ➔</button>
    </form>

    <div class="sso-divider"><span>OR CONTINUE WITH</span></div>

    <div class="sso-grid">
      <a href="select-org.html" class="btn-sso" style="text-decoration: none;"><span style="color: #00a4ef;">❖</span> Microsoft</a>
      <a href="select-org.html" class="btn-sso" style="text-decoration: none;"><span style="color: #ea4335;">G</span> Google</a>
    </div>

    <div class="flex justify-between" style="margin-top: 1.25rem; font-size: 0.85rem;">
      <a href="verify-otp.html">📱 OTP Login</a>
      <a href="select-org.html">🔳 QR Code Login</a>
    </div>
  </div>

  <footer style="position: absolute; bottom: 1rem; left: 0; right: 0; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
    <div>© 2026 SVPMS Security Systems Inc. • <a href="index.html" style="color: var(--text-secondary);">Home</a> • <a href="help.html" style="color: var(--text-secondary);">Privacy & Compliance</a></div>
  </footer>

  <script>
    // Read role query param if present
    const urlParams = new URLSearchParams(window.location.search);
    const roleParam = urlParams.get('role');
    if (roleParam) {
      document.getElementById('login-role-title').textContent = roleParam + ' Portal';
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
