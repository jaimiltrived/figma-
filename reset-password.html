<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - SVPMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">

  <div class="auth-card">
    <div class="auth-card-header">
      <div class="brand-icon">🛡️</div>
      <h2>Set New Password</h2>
      <p>Must be at least 8 characters with numbers & symbols</p>
    </div>

    <form action="password-success.html">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" id="new-password" class="form-control" required placeholder="••••••••" value="Secur1tyPass!">
        <div class="strength-meter">
          <div id="strength-bar" class="strength-bar" style="width: 100%; background-color: var(--success);"></div>
        </div>
        <div id="strength-text" style="font-size: 0.75rem; color: var(--success); margin-top: 0.35rem; text-align: right;">Strength: Strong</div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" id="confirm-password" class="form-control" required placeholder="••••••••" value="Secur1tyPass!">
      </div>

      <button type="submit" class="btn btn-primary btn-full">Reset Password ➔</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
