<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP - SVPMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <div class="auth-card">
    <a href="forgot-password.html" style="position: absolute; top: 1.25rem; right: 1.25rem; color: var(--text-muted); font-size: 1.25rem; text-decoration: none;" title="Back">✕</a>

    <div class="auth-card-header">
      <div class="brand-icon">📩</div>
      <h2>Verify OTP Code</h2>
      <p>We sent a 6-digit code to <span style="font-weight: 700; color: var(--text-primary);">user@company.com</span></p>
    </div>

    <form action="reset-password.html">
      <div class="otp-container">
        <input type="text" class="otp-digit" maxlength="1" autofocus value="8">
        <input type="text" class="otp-digit" maxlength="1" value="4">
        <input type="text" class="otp-digit" maxlength="1" value="2">
        <input type="text" class="otp-digit" maxlength="1" value="9">
        <input type="text" class="otp-digit" maxlength="1" value="1">
        <input type="text" class="otp-digit" maxlength="1" value="0">
      </div>

      <div style="text-align: center; margin-bottom: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
        Resend OTP in <span id="otp-timer" style="font-weight: 700; color: var(--accent-primary);">60</span>s
        <button type="button" id="btn-resend-otp" style="display: none; color: var(--accent-primary); font-weight: 700; margin-left: 0.5rem;">Resend Code</button>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Verify Code & Continue ➔</button>
    </form>
  </div>


  <script src="app.js"></script>
</body>
</html>
